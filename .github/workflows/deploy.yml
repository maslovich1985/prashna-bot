name: Deploy to VPS

on:
  push:
    branches: [main]        # мерж PR в main = push в main = деплой
  pull_request:
    branches: [main]        # на PR гоняем только job `check`, без деплоя
  workflow_dispatch:        # плюс кнопка «запустить вручную» в интерфейсе GitHub

concurrency:
  # Прогоны на PR не должны занимать очередь деплоя: у каждого PR своя группа,
  # и новый пуш в ветку отменяет предыдущий прогон. Деплой по-прежнему строго
  # последовательный и неотменяемый.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Образ пинуем: 19.10.2026 ubuntu-latest уезжает на Ubuntu 26, и смена
    # системного окружения не должна прилетать в деплой-пайплайн сама собой.
    name: Проверка кода
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: |
          ruff check .
          ruff format --check .

      - name: Синтаксис
        run: python -m compileall -q app run.py

      - name: Тесты
        run: pytest -q

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # gitleaks смотрит всю историю, а не один коммит

      # Бинарь из релиза, а не gitleaks/gitleaks-action@v2: версия пинуется явно и
      # не зависит от условий лицензии экшена, если репозиторий снова станет приватным.
      - name: Установка gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.30.1

      - name: Сканирование истории
        run: gitleaks git --redact --no-banner --verbose .

  deploy:
    name: Деплой на VPS
    needs: [check, secrets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Настройка SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Ключ снимается один раз: сверяем и кладём в known_hosts один и тот же ответ,
          # иначе между проверкой и rsync остаётся окно на подмену.
          ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > /tmp/hostkey.pub
          test -s /tmp/hostkey.pub
          actual="$(ssh-keygen -lf /tmp/hostkey.pub | awk '{print $2}')"

          if [ -z "${SSH_HOST_FINGERPRINT:-}" ]; then
            echo "::warning::SSH_HOST_FINGERPRINT не задан — ключ хоста не сверяется. Сейчас: $actual"
          elif [ "$actual" != "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Ключ хоста $SSH_HOST не совпал с SSH_HOST_FINGERPRINT."
            echo "Ожидался: $SSH_HOST_FINGERPRINT"
            echo "Получен:  $actual"
            exit 1
          fi

          cat /tmp/hostkey.pub >> ~/.ssh/known_hosts

      - name: Загрузка кода на сервер
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude '.git' --exclude '.github' --exclude 'data' --exclude '.env' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/prashna-bot/incoming/"

      - name: Применение и перезапуск
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo /opt/prashna-bot/deploy/apply.sh"

      - name: Проверка, что бот поднялся
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "systemctl is-active prashna-bot"
